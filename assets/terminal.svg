<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 15px; }
      .p { fill: #00ff41; }
      .w { fill: #c9d1d9; }
      .d { fill: #6e7681; }
      .c { fill: #58a6ff; }
      .y { fill: #f2cc60; }
      .l { opacity: 0; animation: show 0.01s forwards; }
      @keyframes show { to { opacity: 1; } }
      .l1 { animation-delay: 0.4s; }
      .l2 { animation-delay: 1.2s; }
      .l3 { animation-delay: 2.2s; }
      .l4 { animation-delay: 2.7s; }
      .l5 { animation-delay: 3.2s; }
      .l6 { animation-delay: 3.7s; }
      .l7 { animation-delay: 4.7s; }
      .l8 { animation-delay: 5.4s; }
      .bar { transform-origin: 0 0; transform: scaleX(0); animation: grow 2s 5.4s forwards steps(20); }
      @keyframes grow { to { transform: scaleX(1); } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="1" y="1" width="818" height="328" rx="12" fill="url(#bg)" stroke="#00ff41" stroke-opacity="0.55"/>
  <rect x="1" y="1" width="818" height="38" rx="12" fill="#161b22"/>
  <rect x="1" y="26" width="818" height="13" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="20" r="6" fill="#27c93f"/>
  <text x="410" y="25" text-anchor="middle" class="d" style="font-size:13px">abhay@dev: ~</text>

  <g filter="url(#glow)">
    <text x="26" y="72" class="l l1"><tspan class="p">abhay@dev</tspan><tspan class="w">:</tspan><tspan class="c">~</tspan><tspan class="w">$ whoami</tspan></text>
    <text x="26" y="98" class="l l2 w">Abhay Patil · AI app builder · full stack builder · AI agents builder</text>

    <text x="26" y="134" class="l l3"><tspan class="p">abhay@dev</tspan><tspan class="w">:</tspan><tspan class="c">~</tspan><tspan class="w">$ cat status.txt</tspan></text>
    <text x="26" y="160" class="l l4"><tspan class="y">studying </tspan><tspan class="d">→ </tspan><tspan class="w">Energy Engineering</tspan></text>
    <text x="26" y="182" class="l l5"><tspan class="y">building </tspan><tspan class="d">→ </tspan><tspan class="w">voice assistants · AI agents · apps</tspan></text>
    <text x="26" y="204" class="l l6"><tspan class="y">stack    </tspan><tspan class="d">→ </tspan><tspan class="w">Python · React · FastAPI · Gemini</tspan></text>

    <text x="26" y="240" class="l l7"><tspan class="p">abhay@dev</tspan><tspan class="w">:</tspan><tspan class="c">~</tspan><tspan class="w">$ ./ship --ideas</tspan></text>
    <g class="l l8">
      <text x="26" y="266" class="d">[</text>
      <rect class="bar" x="42" y="253" width="300" height="14" fill="#00ff41"/>
      <text x="348" y="266" class="d">]</text>
      <text x="372" y="266" class="p">shipping...</text>
    </g>
    <text x="26" y="302" class="l l8"><tspan class="p">abhay@dev</tspan><tspan class="w">:</tspan><tspan class="c">~</tspan><tspan class="w">$ </tspan><tspan class="p cursor">█</tspan></text>
  </g>
</svg>

